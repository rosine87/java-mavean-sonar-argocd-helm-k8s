#tsamodocker2020/ultimate-cicd:<BUILD_NUMBER>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-app
  labels:
    app: spring-boot-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      labels:
        app: spring-boot-app
    spec:
      containers:
      - name: spring-boot-app
        image: tsamodocker2020/ultimate-cicd-pipeline:26
        ports:
        - containerPort: 8081